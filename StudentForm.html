<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      :root {
        color-scheme: light;
        --navy: #1f4e78;
        --teal: #0f6b6d;
        --ink: #202124;
        --muted: #667085;
        --line: #d7dee7;
        --surface: #f6f8fa;
        --danger: #b42318;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, "Noto Sans KR", sans-serif;
        color: var(--ink);
        background: #ffffff;
      }

      header {
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 3px solid var(--teal);
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.3;
        letter-spacing: 0;
      }

      .class-tag {
        display: inline-block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 12px;
      }

      .field { margin-bottom: 15px; }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 700;
      }

      select,
      input {
        width: 100%;
        height: 42px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--ink);
        font: 14px Arial, "Noto Sans KR", sans-serif;
        outline: none;
      }

      select:focus,
      input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(15, 107, 109, 0.12);
      }

      select:disabled,
      input:disabled { background: var(--surface); }

      #status {
        min-height: 38px;
        margin-top: 4px;
        padding: 9px 10px;
        border-radius: 6px;
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      #status.error {
        background: #fff1f0;
        color: var(--danger);
      }

      #status.success {
        background: #ecf8f3;
        color: #176b50;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }

      button {
        height: 40px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .secondary {
        border-color: var(--line);
        background: #ffffff;
        color: var(--ink);
      }

      .primary {
        background: var(--navy);
        color: #ffffff;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>신입생 추가</h1>
      <span class="class-tag">성적입력 학생 관리</span>
    </header>

    <form id="student-form">
      <div class="field">
        <label for="day">요일</label>
        <select id="day" required disabled></select>
      </div>

      <div class="field">
        <label for="time">시간</label>
        <select id="time" required disabled></select>
      </div>

      <div class="field">
        <label for="className">반 이름</label>
        <select id="className" required disabled></select>
      </div>

      <div class="field">
        <label for="studentName">학생 이름</label>
        <input id="studentName" type="text" maxlength="30" autocomplete="off" required disabled>
      </div>

      <div class="field">
        <label for="grade">Grade</label>
        <select id="grade" required disabled></select>
      </div>

      <div id="status">목록을 불러오는 중입니다.</div>

      <div class="actions">
        <button class="secondary" type="button" onclick="google.script.host.close()">취소</button>
        <button class="primary" id="submit" type="submit" disabled>학생 추가</button>
      </div>
    </form>

    <script>
      const fields = ['day', 'time', 'className', 'studentName', 'grade'];
      const form = document.getElementById('student-form');
      const status = document.getElementById('status');
      const submit = document.getElementById('submit');

      function setOptions(id, values) {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="">선택</option>' + values
          .map(value => '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>')
          .join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function setEnabled(enabled) {
        fields.forEach(id => document.getElementById(id).disabled = !enabled);
        submit.disabled = !enabled;
      }

      function showStatus(message, type) {
        status.textContent = message;
        status.className = type || '';
      }

      google.script.run
        .withSuccessHandler(options => {
          setOptions('day', options.days);
          setOptions('time', options.times);
          setOptions('className', options.classes);
          setOptions('grade', options.grades);
          setEnabled(true);
          showStatus('입력할 학생 정보를 선택하세요.');
          document.getElementById('day').focus();
        })
        .withFailureHandler(error => showStatus(error.message, 'error'))
        .getNewStudentFormOptions();

      form.addEventListener('submit', event => {
        event.preventDefault();
        const payload = {
          day: document.getElementById('day').value,
          time: document.getElementById('time').value,
          className: document.getElementById('className').value,
          studentName: document.getElementById('studentName').value.trim(),
          grade: document.getElementById('grade').value,
        };
        setEnabled(false);
        showStatus('학생 행을 추가하고 있습니다.');
        google.script.run
          .withSuccessHandler(result => {
            showStatus(result.message, 'success');
            setTimeout(() => google.script.host.close(), 900);
          })
          .withFailureHandler(error => {
            setEnabled(true);
            showStatus(error.message, 'error');
          })
          .createNewStudent(payload);
      });
    </script>
  </body>
</html>
